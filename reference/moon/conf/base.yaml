---
# this is the config that will be loaded as default by main.py
# Please follow the provided structure (this will ensuring all baseline follow
# a similar configuration structure and hence be easy to customise)

num_clients: 10
num_epochs: 10
fraction_fit: 1.0
batch_size: 64
learning_rate: 0.01
mu: 5
temperature: 0.5
alg: moon
seed: 0
server_device: cpu
num_rounds: 100

# BN-based drift control settings
bn_drift_control:
  enabled: false
  update_frequency: 100  # Update adaptive mu every N batches
  min_mu_factor: 0.1    # Minimum mu factor relative to base mu
  max_mu_factor: 2.0    # Maximum mu factor relative to base mu

# Comparison settings
compare_with_base: false  # Set to true to compare with base MOON results
base_results_path: ./results/base_moon_results.json  # Path to base MOON results
save_for_comparison: true  # Set to true to save current results for future comparison
results_dir: ./results  # Directory to save results for future comparison

client_resources:
  num_cpus: 2
  num_gpus: 1

dataset:
  # dataset config
  name: cifar10
  dir: ./data/moon/
  partition: noniid
  beta: 0.5

model:
  # model config
  name: resnet50-cifar10
  output_dim: 256
  dir: ./models/moon/